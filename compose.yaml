services:
  postgres:
    image: postgres:16-alpine
    container_name: devdesk-postgres
    environment:
      POSTGRES_USER: devdesk_user
      POSTGRES_PASSWORD: devdesk_password
      POSTGRES_DB: devdesk_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdesk_user -d devdesk_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: devdesk-api
    environment:
      POSTGRES_USER: devdesk_user
      POSTGRES_PASSWORD: devdesk_password
      POSTGRES_DB: devdesk_db
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SECRET_KEY: change-this-secret-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
